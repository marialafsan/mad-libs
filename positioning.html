<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Static Structure</title>

        <!--Fonts-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">

        <style>

            *{
                box-sizing:border-box;
            }

            body {

                /* Fonts and colors */
                font-family: "Fredoka", sans-serif;  /* body text */
                font-weight: 500;
                font-size: 18px;
                color: #3A4A5A;
                background: #ffffff;

                margin: 0;
                min-height: 100vh;

                display: flex;
                align-items: center;
                justify-content: center;
            }

            #container{

                width:100%;

                display: grid;
                gap: 25px;
                align-items: center;
                justify-items: center;
                padding: 20px 0;

            }

            #header{

                /* Fonts and colors */
                font-family: "Fredoka", sans-serif;
                font-weight: 600;
                font-size: 44px;
                color: #F1B57C;

                text-align:center;
                margin-bottom:-10px;
            }

            .word-type{
                color: #3A4A5A;
                font-size: 20px;
            }
            

            .card{

                /* Fonts and colors */

                background: #DCEAFB;
                border: 1px solid #C7D3E0;
                border-radius: 12px; 

                /* background: #EAF0F8;
                border: 1px solid #C7D3E0;
                border-radius: 16px; */

                min-height:200px;
                width:350px;
            }

            .descriptions{
                font-size: 16px;
            }

            #card-1{

                display: flex;
                flex-direction: column;
                align-items:center;
                justify-content: center;
                padding:20px;

                color:#5F7E9C
            }

            #card-2{
               
                /* Fonts and colors */
                background: #F2EFF8;
                color: #5F7E9C;;
                padding: 0 25px;

                font-size: 20px;
                
            }

            #story{

                /* Colors */
                color: #3A4A5A;

                font-size: 16px;
                font-weight: 450;

            }

            #questions{

                /* Fonts and colors */

                /* background: #DCEAFB;
                border: 1px solid #C7D3E0;
                border-radius: 12px; */

                margin-top: -16px;
                height: 100%;

            }

            button{

                /* Shape, fonts and colors */
                font-family: "Fredoka", sans-serif;
                font-weight: 600;
                font-size: 18px;
                color: #3A4A5A;
                background: #DBE4EE;
                
                border: 1px solid #c3cedb;
                border-radius: 14px;
                padding:12px 50px;

                height:fit-content;
                margin-top:20px;
            }

            #restart{
                /* Correcting the margin inherited from the initial button */
                margin-top:-10px;
            }

            /* Styling of the form contents */
            input[type="text"],
            select {
                font-family: inherit;
                font-size: 18px;
                color: #3A4A5A;
                background: #fff;
                border: 1.5px solid #C7D3E0;
                border-radius: 6px;
                padding:1px 1px;
            }

            /*Styling of the placeholders so they look like suggestions*/
            input::placeholder {
                color: #a4aebb77; 
                font-style: italic;
                
            }

        </style>
    </head>

    <body>

        <div id="container">

            <div id="header"> Mad Libs </div>

            <div class="card" id="card-1">
                <div id="questions">
                    
                    <ul></ul>    
                            <span class="word-type"><strong>name</strong></span>
                            <br>
                            <input type="text" id="name" placeholder="Jane Doe">
                            <br>
                            <span class="descriptions"><em>select</em></span>
                            <select name ="gender" id="gender">
                                <option value="female">female</option>
                                <option value="male">male</option>
                                <option value="other">other</option>
                            </select>
                        <br>
                        <br>

                            <span class="word-type"><strong>sample</strong></span>
                            <br>
                            <span class="descriptions"><em>description</em></span>
                            <br>
                            <input type="text" id="noun1" placeholder="word">
                        <br>
                        <br>

                        <span class="word-type"><strong>sample</strong></span>
                            <br>
                            <input type="text" id="name" placeholder="word">
                        </li>
                        <br>
                        
                    
            </div>
                <button id="button">Lib it!</button>
            </div>

            <div class="card" id="card-2">
                <p><strong>Your story here: </strong>
                    <span id="story"> <br> Story would generate here </span>
                </p>
            </div>

            <button class="button" id="restart">Start Over</button>

        </div>

        <script>
                        
        </script>
    </body>

</html>
