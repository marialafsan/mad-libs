<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Mad Libs Structure</title>

        <style>
            *{
                box-sizing:border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;

                display: flex;
                align-items: center;
                justify-content: center;
            }

            #container{

                background-color: rgb(245, 249, 255);
                width:100%;

                display: grid;
                gap: 25px;
                align-items: center;
                justify-items: center;
                padding: 20px 0;

            }

            #header{
                text-align:center;
                margin-bottom:-10px;
            }
            
            #card-1{
                
                height:200px;
                width:350px;
                background-color: lightblue;
                border: 1px solid lightslategray;

                display: flex;
                flex-direction: column;
                align-items:center;
                justify-content: center;
                padding:10px;
            }

            #card-2{
                height:200px;
                width:350px;
                background-color: lightblue;
                border: 1px solid lightslategray;

                padding: 0 20px;
                
            }

            #questions{
                background-color: rgb(193, 224, 255);
                border: 1px solid lightslategray;

                height: 100%;

                display:flex;
                align-items: center;
                justify-content: center;

                padding: 0 10px;
            }

            button{
                height:fit-content;
                margin-top:10px;
            }
        </style>
    </head>

    <body>

        <div id="container">

            <div id="header"> Hello </div>

            <div id="card-1">
                <div id="questions">bla bla bla</div>
                <button id="button">Press me!</button>
            </div>

            <div id="card-2">
                <h5>Story here:</h5>
                <p><span id="story">balbalbal</span></p>
            </div>

        </div>
    </body>

</html>
